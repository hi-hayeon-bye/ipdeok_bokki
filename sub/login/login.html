<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 입덕볶이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="../../css/side-menu.css">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- 기존 프로젝트와 동일한 CSS 슬라이드 메뉴 -->
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="menu-overlay" aria-label="메뉴 닫기"></label>
    <aside class="side-menu" aria-label="전체 메뉴">
      <div class="side-menu-header">
        <a href="../../index.html" class="side-menu-brand" aria-label="입덕볶이 홈"><img src="../../img/Logo.png" alt=""><span>입덕볶이</span></a>
        <label for="menu-toggle" class="menu-close" aria-label="메뉴 닫기">
          <iconify-icon icon="mdi:close"></iconify-icon>
        </label>
      </div>
      <div class="side-menu-login">
        <strong>입덕볶이에 오신 걸 환영해요!</strong>
        <p>로그인하고 입덕볶이를 더 즐겨보세요.</p>
        <a href="login.html" class="side-menu-login-button" aria-current="page">로그인하기</a>
      </div>
      <nav class="side-menu-list">
        <a href="../../index.html"><iconify-icon icon="mdi:home-outline"></iconify-icon><span>홈</span><iconify-icon icon="mdi:chevron-right"></iconify-icon></a>
        <a href="../lists/lists.html"><iconify-icon icon="mdi:silverware-fork-knife"></iconify-icon><span>메뉴 주문</span><iconify-icon icon="mdi:chevron-right"></iconify-icon></a>
        <a href="../../index.html#event"><iconify-icon icon="mdi:gift-outline"></iconify-icon><span>이벤트</span><iconify-icon icon="mdi:chevron-right"></iconify-icon></a>
        <a href="../community/community.html"><iconify-icon icon="mdi:chat-outline"></iconify-icon><span>커뮤니티</span><iconify-icon icon="mdi:chevron-right"></iconify-icon></a>
        <a href="../about/about.html"><iconify-icon icon="mdi:information-outline"></iconify-icon><span>브랜드 소개</span><iconify-icon icon="mdi:chevron-right"></iconify-icon></a>
      </nav>
    </aside>

    <header class="header">
      <a href="../../index.html" class="logo">
        <img src="../../img/Logo.png" alt="입덕볶이 로고">
        <span class="logo-text">입덕볶이</span>
      </a>
      <label for="menu-toggle" class="menu-trigger" aria-label="메뉴 열기">
        <iconify-icon icon="mdi:menu" class="menu-icon"></iconify-icon>
      </label>
    </header>

    <main>
      <section class="hero" aria-label="입덕볶이와 더 가까이">
        <img src="img/banner.png" alt="입덕볶이와 더 가까이! 로그인하고 더 많은 혜택을 만나보세요!">
      </section>

      <section class="login-section" aria-labelledby="login-title">
        <h1 id="login-title">로그인</h1>
        <p class="login-intro">입덕볶이 계정으로<br>다양한 서비스를 이용해보세요.</p>
        <p class="community-login-notice" id="community-login-notice" role="status" hidden>커뮤니티에 참여하려면 로그인이 필요해요.</p>

        <!-- 데모 화면: 실제 서버 로그인은 연결되어 있지 않습니다. -->
        <form class="login-form" id="login-form">
          <label class="input-wrap" for="login-email">
            <iconify-icon icon="mdi:account-outline" aria-hidden="true"></iconify-icon>
            <input id="login-email" name="email" type="email" placeholder="아이디(이메일)를 입력하세요." autocomplete="username" required>
          </label>
          <label class="input-wrap password-wrap" for="login-password">
            <iconify-icon icon="mdi:lock-outline" aria-hidden="true"></iconify-icon>
            <input id="login-password" name="password" type="password" placeholder="비밀번호를 입력하세요." autocomplete="current-password" required>
            <button class="password-toggle" type="button" id="password-toggle" aria-label="비밀번호 표시" aria-pressed="false">
              <iconify-icon icon="mdi:eye-off-outline" aria-hidden="true"></iconify-icon>
            </button>
          </label>

          <div class="form-options">
            <label class="remember-label"><input type="checkbox" name="remember"><span>로그인 상태 유지</span></label>
            <div class="find-links">
              <button type="button" data-notice="아이디 찾기">아이디 찾기</button>
              <span aria-hidden="true">|</span>
              <button type="button" data-notice="비밀번호 찾기">비밀번호 찾기</button>
            </div>
          </div>

          <button class="login-button" type="submit">로그인</button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>

        <div class="separator"><span>또는</span></div>
        <div class="social-buttons" aria-label="소셜 로그인">
          <button type="button" class="social-button" data-notice="카카오 로그인"><span class="social-logo kakao" aria-hidden="true">●</span><span>카카오로 로그인</span></button>
          <button type="button" class="social-button" data-notice="네이버 로그인"><span class="social-logo naver" aria-hidden="true">N</span><span>네이버로 로그인</span></button>
          <button type="button" class="social-button" data-notice="구글 로그인"><span class="social-logo google" aria-hidden="true">G</span><span>구글로 로그인</span></button>
        </div>
        <div class="join-guide">
          <span>아직 계정이 없으신가요?</span>
          <button type="button" data-notice="회원가입">회원가입 <iconify-icon icon="mdi:chevron-right" aria-hidden="true"></iconify-icon></button>
        </div>
      </section>
    </main>

  </div>

  <script>
    const form = document.querySelector('#login-form');
    const message = document.querySelector('#form-message');
    const password = document.querySelector('#login-password');
    const toggle = document.querySelector('#password-toggle');
    const communityNotice = document.querySelector('#community-login-notice');
    const entrySource = new URLSearchParams(window.location.search).get('from');
    if (entrySource === 'community') communityNotice.hidden = false;
    toggle.addEventListener('click', () => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      toggle.setAttribute('aria-pressed', String(show));
      toggle.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 표시');
      toggle.querySelector('iconify-icon').setAttribute('icon', show ? 'mdi:eye-outline' : 'mdi:eye-off-outline');
    });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      message.textContent = '현재는 화면 시연용 프로토타입으로, 실제 로그인 기능은 연결되어 있지 않습니다.';
    });
    document.querySelectorAll('[data-notice]').forEach(button => {
      button.addEventListener('click', () => {
        message.textContent = button.dataset.notice + ' 기능은 준비 중입니다.';
        message.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
  </script>
</body>
</html>
