
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>메뉴 상세 | 입덕볶이</title>

    <link rel="stylesheet" href="css/detail.css">
    <link rel="stylesheet" href="../../css/side-menu.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="../js/order-store.js" defer></script>
</head>

<body data-page="detail">

    <div class="container">

        <!-- 슬라이드 메뉴 상태 -->
        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <!-- 메뉴 외부 배경 -->
        <label for="menu-toggle" class="menu-overlay" aria-label="메뉴 닫기"></label>

        <!-- 슬라이드 메뉴 -->
        <aside class="side-menu" aria-label="전체 메뉴">
            <div class="side-menu-header">
                <a href="../../index.html" class="side-menu-brand" aria-label="입덕볶이 홈"><img src="../../img/Logo.png" alt=""><span>입덕볶이</span></a>
                <label for="menu-toggle" class="menu-close" aria-label="메뉴 닫기">
                    <iconify-icon icon="mdi:close"></iconify-icon>
                </label>
            </div>
            <div class="side-menu-login">
                <strong>입덕볶이에 오신 걸 환영해요!</strong>
                <p>로그인하고 입덕볶이를 더 즐겨보세요.</p>
                <a href="../login/login.html" class="side-menu-login-button">로그인하기</a>
            </div>
            <nav class="side-menu-list">
                <a href="../../index.html"><iconify-icon icon="mdi:home-outline"></iconify-icon><span>홈</span><iconify-icon icon="mdi:chevron-right"></iconify-icon></a>
                <a href="../lists/lists.html"><iconify-icon icon="mdi:silverware-fork-knife"></iconify-icon><span>메뉴 주문</span><iconify-icon icon="mdi:chevron-right"></iconify-icon></a>
                <a href="../../index.html#event"><iconify-icon icon="mdi:gift-outline"></iconify-icon><span>이벤트</span><iconify-icon icon="mdi:chevron-right"></iconify-icon></a>
                <a href="../community/community.html"><iconify-icon icon="mdi:chat-outline"></iconify-icon><span>커뮤니티</span><iconify-icon icon="mdi:chevron-right"></iconify-icon></a>
                <a href="../about/about.html"><iconify-icon icon="mdi:information-outline"></iconify-icon><span>브랜드 소개</span><iconify-icon icon="mdi:chevron-right"></iconify-icon></a>
            </nav>
        </aside>


        <!-- Header -->
        <header class="header">

            <a href="../../index.html" class="logo">
                <img src="../../img/Logo.png" alt="입덕볶이 로고">
                <span class="logo-text">입덕볶이</span>
            </a>

            <label for="menu-toggle" class="menu-trigger" aria-label="메뉴 열기">
                <iconify-icon icon="mdi:menu" class="menu-icon"></iconify-icon>
            </label>

        </header>


        <main>

            <!-- 뒤로 가기 -->
            <div class="back-navigation">
                <a href="../lists/lists.html">
                    <iconify-icon icon="mdi:chevron-left"></iconify-icon>
                    <span>메뉴 리스트로 돌아가기</span>
                </a>
            </div>


            <!-- 상품 이미지 -->
            <section class="detail-image">
                <img
                    src="../lists/img/classic.webp"
                    alt="입덕 오리지널 떡볶이"
                >
            </section>


            <!-- 상품 정보 -->
            <section class="detail-info">

                <div class="product-labels">
                    <span class="best-badge">BEST</span>
                    <span class="product-category">떡볶이 메뉴</span>
                </div>

                <h1>입덕 오리지널 떡볶이</h1>

                <p class="product-description">
                    입덕볶이의 시그니처!<br>
                    중독적인 매콤달콤 맛!
                </p>

                <strong class="product-price">6,900원</strong>

            </section>


            <!-- 옵션 선택 -->
            <section class="detail-options">

                <!-- 맵기 선택 -->
                <div class="option-section">

                    <h2>맵기 선택</h2>

                    <div class="option-list">

                        <label class="option-item">
                            <span>순한맛</span>
                            <input type="radio" name="spicy" value="mild">
                        </label>

                        <label class="option-item">
                            <span>보통맛 (기본)</span>
                            <input type="radio" name="spicy" value="normal" checked>
                        </label>

                        <label class="option-item">
                            <span>매운맛</span>
                            <input type="radio" name="spicy" value="hot">
                        </label>

                    </div>

                </div>


                <!-- 토핑 선택 -->
                <div class="option-section">

                    <div class="option-heading">
                        <h2>토핑 추가</h2>
                        <span>선택사항</span>
                    </div>

                    <div class="option-list">

                        <label class="option-item">
                            <span>치즈 추가</span>

                            <div class="option-right">
                                <span>+2,000원</span>
                                <input type="checkbox" name="cheese" data-topping-id="cheese" data-topping-name="치즈 추가" data-topping-price="2000">
                            </div>
                        </label>

                        <label class="option-item">
                            <span>삶은 계란</span>

                            <div class="option-right">
                                <span>+1,000원</span>
                                <input type="checkbox" name="egg" data-topping-id="egg" data-topping-name="계란 추가" data-topping-price="1000">
                            </div>
                        </label>

                        <label class="option-item">
                            <span>납작당면</span>

                            <div class="option-right">
                                <span>+1,500원</span>
                                <input type="checkbox" name="noodle" data-topping-id="noodle" data-topping-name="사리 추가" data-topping-price="1500">
                            </div>
                        </label>

                    </div>

                </div>


                <!-- 수량 선택 -->
                <div class="quantity-section">

                    <h2>수량 선택</h2>

                    <div class="quantity-control">
                        <button type="button" class="quantity-btn" data-quantity-action="decrease" aria-label="수량 감소">−</button>

                        <span class="quantity-number" id="quantity-value" aria-live="polite">1</span>

                        <button type="button" class="quantity-btn" data-quantity-action="increase" aria-label="수량 증가">+</button>
                    </div>

                </div>

            </section>


            <!-- 주문 금액 -->
            <section class="total-section">

                <div class="total-box">
                    <span>총 주문 금액</span>
                    <strong id="product-total" aria-live="polite">6,900원</strong>
                </div>

                <!-- 장바구니 버튼 -->
                <button type="button" class="cart-button" id="add-to-cart">
                    <iconify-icon icon="mdi:cart-outline"></iconify-icon>
                    <span>장바구니 담기</span>
                </button>

                <div class="cart-feedback" id="cart-feedback" role="status" aria-live="polite" tabindex="-1" hidden>
                    <p id="cart-feedback-text"></p>
                    <div class="cart-feedback-actions">
                        <a href="../lists/lists.html" class="feedback-secondary">메뉴 더 보기</a>
                        <a href="../payment/payment.html" class="feedback-primary">결제 페이지로 이동</a>
                    </div>
                </div>

            </section>

        </main>

    </div>

</body>
</html>
